services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-project-tracker-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${BACKEND_HOST_PORT:-5000}:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?MONGO_URI must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_HOST_PORT:-7448}}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: ${FRONTEND_IMAGE:-project-tracker-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${FRONTEND_HOST_PORT:-7448}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://localhost/']
      interval: 15s
      timeout: 5s
      retries: 5

  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    image: ${MONGODB_IMAGE:-project-tracker-mongodb}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-project_tracker}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME must be set}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD must be set}
    volumes:
      - production_mongo_data:/data/db
    ports:
      - '${MONGO_HOST_PORT:-27018}:27017'
    expose:
      - '27017'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval ''db.runCommand({ ping: 1 }).ok'' --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  production_mongo_data:
